<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>売上日報</title>
    <style>
      :root {
        --bg: #eef3f0;
        --card: #ffffff;
        --ink: #1c2b24;
        --muted: #5f7268;
        --line: #d5e0da;
        --accent: #1f6f54;
        --warn: #8a4b2d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
        background:
          radial-gradient(circle at top left, #d9ebe2 0, transparent 42%),
          linear-gradient(180deg, #f7faf8 0%, var(--bg) 100%);
        color: var(--ink);
        min-height: 100vh;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-end;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.35rem;
        letter-spacing: 0.04em;
      }
      .meta { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: end;
        margin-bottom: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 140px;
        flex: 1;
      }
      .field label {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .field select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
        min-height: 44px;
      }
      .hint {
        width: 100%;
        color: var(--muted);
        font-size: 0.8rem;
      }
      button {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 10px;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
        min-height: 44px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(28, 43, 36, 0.06);
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: inherit;
        font-size: 1rem;
        line-height: 1.7;
      }
      .error {
        margin-bottom: 12px;
        color: var(--warn);
        font-size: 0.9rem;
        display: none;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: #17352b;
        color: #fff;
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 0.9rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>売上日報</h1>
          <div class="meta">
            対象: <span id="targetLabel">読込中…</span><br />
            更新: <span id="updatedAt">-</span>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="copyBtn">文章をコピー</button>
          <button id="reloadBtn">再読込</button>
        </div>
      </header>

      <section class="controls">
        <div class="field">
          <label for="fromSelect">開始日</label>
          <select id="fromSelect"></select>
        </div>
        <div class="field">
          <label for="toSelect">終了日</label>
          <select id="toSelect"></select>
        </div>
        <button class="primary" id="rangeBtn">期間で表示</button>
        <div class="hint">連休などは開始日〜終了日を選んで「期間で表示」を押してください。</div>
      </section>

      <div class="error" id="errorBox"></div>

      <section class="card">
        <pre id="report">読み込み中…</pre>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script>
      var dataStore = null;

      function showToast(message) {
        var el = document.getElementById('toast');
        el.textContent = message;
        el.classList.add('show');
        setTimeout(function () { el.classList.remove('show'); }, 1600);
      }

      function sortValue(key) {
        var parts = String(key).split('/');
        return Number(parts[0]) * 100 + Number(parts[1]);
      }

      function formatNumber(n) {
        return Math.round(n).toLocaleString('ja-JP');
      }

      function fillSelect(selectEl, options, selectedKey) {
        selectEl.innerHTML = '';
        if (!options.length) {
          var empty = document.createElement('option');
          empty.value = '';
          empty.textContent = '日付なし';
          selectEl.appendChild(empty);
          return;
        }
        for (var i = 0; i < options.length; i++) {
          var opt = document.createElement('option');
          opt.value = options[i].key;
          opt.textContent = options[i].label;
          if (options[i].key === selectedKey) opt.selected = true;
          selectEl.appendChild(opt);
        }
        if (!selectedKey) selectEl.selectedIndex = options.length - 1;
      }

      function findLabel(key) {
        var hit = (dataStore.dateOptions || []).find(function (d) { return d.key === key; });
        return hit ? hit.label : key;
      }

      function buildClinicRange(clinic, fromKey, toKey) {
        var fromVal = sortValue(fromKey);
        var toVal = sortValue(toKey);
        var selected = (clinic.days || []).filter(function (d) {
          var v = sortValue(d.key);
          return v >= fromVal && v <= toVal && (d.patients > 0 || d.sales > 0);
        });
        if (!selected.length) {
          return { name: clinic.name, type: clinic.type, missing: true, days: [] };
        }
        var asOf = selected[selected.length - 1];
        var cumPatients = 0;
        var cumSales = 0;
        var cumSurgeryCount = 0;
        var cumSurgerySales = 0;
        (clinic.days || []).forEach(function (day) {
          if (day.month !== asOf.month || day.day > asOf.day) return;
          cumPatients += day.patients;
          cumSales += day.sales;
          if (clinic.type === 'surgery') {
            cumSurgeryCount += day.surgeryCount || 0;
            cumSurgerySales += day.surgerySales || 0;
          }
        });
        return {
          name: clinic.name,
          type: clinic.type,
          missing: false,
          days: selected,
          asOfMonth: asOf.month,
          asOfDay: asOf.day,
          cumPatients: cumPatients,
          cumSales: cumSales,
          cumUnit: cumPatients ? cumSales / cumPatients : 0,
          cumSurgeryCount: cumSurgeryCount,
          cumSurgerySales: cumSurgerySales
        };
      }

      function buildText(reports, fromKey, toKey) {
        var lines = [];
        var startLabel = findLabel(fromKey);
        var endLabel = findLabel(toKey);
        lines.push('お疲れ様です。');
        lines.push('');
        if (fromKey === toKey) {
          lines.push(startLabel + '各店舗の売上です。');
          lines.push('');
          reports.forEach(function (r) {
            lines.push('●' + r.name);
            lines.push('');
            if (r.missing) {
              lines.push('（データなし）');
              lines.push('');
              return;
            }
            var day = r.days[0];
            if (r.type === 'surgery') {
              lines.push('患者件数：' + formatNumber(day.patients) + '件');
              lines.push('(内オぺ：' + formatNumber(day.surgeryCount) + '件)');
              lines.push('売上金額：' + formatNumber(day.sales) + '円');
              lines.push('(内オぺ：' + formatNumber(day.surgerySales) + '円)');
            } else {
              lines.push('患者件数：' + formatNumber(day.patients) + '件');
              lines.push('売上金額：' + formatNumber(day.sales) + '円');
              lines.push('売上単価：' + formatNumber(day.unit) + '円');
            }
            lines.push('');
            lines.push('【' + r.asOfMonth + '/' + r.asOfDay + '時点】');
            if (r.type === 'surgery') {
              lines.push(r.asOfMonth + '月累計患者件数：' + formatNumber(r.cumPatients) + '件');
              lines.push('(内オぺ：' + formatNumber(r.cumSurgeryCount) + '件)');
              lines.push(r.asOfMonth + '月累計売上金額：' + formatNumber(r.cumSales) + '円');
              lines.push('(内オぺ：' + formatNumber(r.cumSurgerySales) + '円)');
            } else {
              lines.push(r.asOfMonth + '月累計患者件数：' + formatNumber(r.cumPatients) + '件');
              lines.push(r.asOfMonth + '月累計売上金額：' + formatNumber(r.cumSales) + '円');
              lines.push(r.asOfMonth + '月平均売上単価：' + formatNumber(r.cumUnit) + '円');
            }
            lines.push('');
          });
        } else {
          lines.push(startLabel + '〜' + endLabel + '各店舗の売上です。');
          lines.push('');
          reports.forEach(function (r) {
            lines.push('●' + r.name);
            lines.push('');
            if (r.missing) {
              lines.push('（データなし）');
              lines.push('');
              return;
            }
            r.days.forEach(function (day, idx) {
              if (idx > 0) lines.push('');
              lines.push(day.month + '/' + day.day + '(' + day.weekday + ')');
              if (r.type === 'surgery') {
                lines.push('患者件数：' + formatNumber(day.patients) + '件');
                lines.push('(内オぺ：' + formatNumber(day.surgeryCount) + '件)');
                lines.push('売上金額：' + formatNumber(day.sales) + '円');
                lines.push('(内オぺ：' + formatNumber(day.surgerySales) + '円)');
              } else {
                lines.push('患者件数：' + formatNumber(day.patients) + '件');
                lines.push('売上金額：' + formatNumber(day.sales) + '円');
                lines.push('売上単価：' + formatNumber(day.unit) + '円');
              }
            });
            lines.push('');
            lines.push('【' + r.asOfMonth + '/' + r.asOfDay + '時点】');
            if (r.type === 'surgery') {
              lines.push(r.asOfMonth + '月累計患者件数：' + formatNumber(r.cumPatients) + '件');
              lines.push('(内オぺ：' + formatNumber(r.cumSurgeryCount) + '件)');
              lines.push(r.asOfMonth + '月累計売上金額：' + formatNumber(r.cumSales) + '円');
              lines.push('(内オぺ：' + formatNumber(r.cumSurgerySales) + '円)');
            } else {
              lines.push(r.asOfMonth + '月累計患者件数：' + formatNumber(r.cumPatients) + '件');
              lines.push(r.asOfMonth + '月累計売上金額：' + formatNumber(r.cumSales) + '円');
              lines.push(r.asOfMonth + '月平均売上単価：' + formatNumber(r.cumUnit) + '円');
            }
            lines.push('');
          });
        }
        lines.push('よろしくお願いいたします。');
        return lines.join('\n');
      }

      function showRange(fromKey, toKey) {
        if (!dataStore) return;
        if (sortValue(fromKey) > sortValue(toKey)) {
          var tmp = fromKey;
          fromKey = toKey;
          toKey = tmp;
        }
        var reports = (dataStore.clinics || []).map(function (clinic) {
          return buildClinicRange(clinic, fromKey, toKey);
        });
        var hasAny = reports.some(function (r) { return !r.missing; });
        var errorBox = document.getElementById('errorBox');
        if (!hasAny) {
          errorBox.style.display = 'block';
          errorBox.textContent = '指定期間のデータがありません。';
          document.getElementById('report').textContent = '指定期間のデータがありません。';
          return;
        }
        errorBox.style.display = 'none';
        var text = buildText(reports, fromKey, toKey);
        var label = fromKey === toKey ? findLabel(fromKey) : findLabel(fromKey) + '〜' + findLabel(toKey);
        document.getElementById('report').textContent = text;
        document.getElementById('targetLabel').textContent = label;
        document.getElementById('updatedAt').textContent = dataStore.updatedAt || '-';
        fillSelect(document.getElementById('fromSelect'), dataStore.dateOptions || [], fromKey);
        fillSelect(document.getElementById('toSelect'), dataStore.dateOptions || [], toKey);
      }

      function loadData() {
        fetch('./data.json?ts=' + Date.now(), { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            dataStore = data;
            var options = data.dateOptions || [];
            var latest = options.length ? options[options.length - 1].key : '';
            fillSelect(document.getElementById('fromSelect'), options, latest);
            fillSelect(document.getElementById('toSelect'), options, latest);
            if (latest) showRange(latest, latest);
            else {
              document.getElementById('report').textContent = '表示できる日付がありません。';
            }
          })
          .catch(function () {
            document.getElementById('report').textContent =
              'データの読み込みに失敗しました。ページを再読み込みしてください。';
          });
      }

      document.getElementById('copyBtn').addEventListener('click', function () {
        var text = document.getElementById('report').textContent;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast('コピーしました');
          }).catch(function () {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      });

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('コピーしました');
      }

      document.getElementById('reloadBtn').addEventListener('click', function () {
        loadData();
        showToast('再読込しました');
      });

      document.getElementById('rangeBtn').addEventListener('click', function () {
        var from = document.getElementById('fromSelect').value;
        var to = document.getElementById('toSelect').value;
        if (!from || !to) {
          showToast('開始日と終了日を選んでください');
          return;
        }
        showRange(from, to);
        showToast('表示を更新しました');
      });

      loadData();
    </script>
  </body>
</html>
